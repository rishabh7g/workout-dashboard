<!-- Single source of the brand mark geometry (#170). Fill colours here are
     --color-accent and --color-surface from css/styles.css, kept in sync by
     hand; scripts/make-icons.js re-resolves both tokens at generation time
     when it cuts the PNGs, so this file is never the only place a colour
     change has to land. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ec3013"></rect>

  <rect x="72" y="246" width="368" height="20" fill="#f7f6f5"></rect>
  <rect x="96" y="192" width="24" height="128" fill="#f7f6f5"></rect>
  <rect x="136" y="160" width="36" height="192" fill="#f7f6f5"></rect>
  <rect x="340" y="160" width="36" height="192" fill="#f7f6f5"></rect>
  <rect x="392" y="192" width="24" height="128" fill="#f7f6f5"></rect>
</svg>